dataset:
  completation:
    type: linear
exclude:
- patient_id
- sex
- admission_type
imputation:
  type: Mice
missingness:
  type: "pyampute"
  amount: [0.1,0.2]
evaluation:
  prediction_eval: [f1_score]
  imputation_eval: [root_mean_squared_error]
path:
  lookup_table: [lookup.yaml,lookup.yaml]
  model_config: [data/model_config.yaml,data/model_config.yaml]
  output_name: [R1,R2] #How the files are named corresponding to each run. Every entry is one run
seed: 42
target: mortality
testsplit: 0.2
multiply: 2 #How often to repeat every run