createmissingness:
  type: ampute
dataset:
  completation:
    type: linear
exclude:
- patient_id
- sex
- admission_type
imputation:
  burn_in: 10
  imputation_iteration: 10
  type: Mice
  update_circle: 3
lookup: lookup.yaml
missingness:
  patterns:
  - mechanism: MCAR
    proportion: 0.3
  - mechanism: MAR
    proportion: 0.3
  - mechanism: MNAR
    proportion: 0.3
paths:
  data: null
  lookup_imputation: null
prediction:
  name: null
  params:
    learning_rate: null
    n_estimator: null
seed: 42
target: mortality
testsplit: 0.2
pa.MultivariateAmputation:
  lower_range: -3
  max_diff_with_target: 0.001
  max_iter: 100
  patterns: null
  prop: 0.5
  seed: null
  std: true
  upper_range: 3
  verbose: false
sk.RandomForestClassifier:
  bootstrap: true
  ccp_alpha: 0.0
  class_weight: null
  criterion: gini
  max_depth: null
  max_features: sqrt
  max_leaf_nodes: null
  max_samples: null
  min_impurity_decrease: 0.0
  min_samples_leaf: 1
  min_samples_split: 2
  min_weight_fraction_leaf: 0.0
  monotonic_cst: null
  n_estimators: 100
  n_jobs: null
  oob_score: false
  random_state: null
  verbose: 0
  warm_start: false
sk.f1_score:
  average: binary
  labels: null
  pos_label: 1
  sample_weight: null
  zero_division: warn
